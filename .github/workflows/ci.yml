name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Install bubblewrap (sandbox bwrap integration tests)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap && sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Integration Test
        run: make test-integration
      - name: Verify sandbox kill regression ran (fail on silent skip)
        run: |
          output=$(go test -tags=integration ./pkg/sandbox/ \
            -run 'TestRegression_BwrapKillBackgroundKillsSandboxedCommand' \
            -v -timeout 120s 2>&1 || true)
          echo "$output"
          if echo "$output" | grep -q -- "--- SKIP"; then
            echo "::error title=Bwrap regression skipped::TestRegression_BwrapKillBackgroundKillsSandboxedCommand was SKIPPED — bubblewrap unusable on this runner (kill_background_task sandbox cleanup is unguarded)"
            exit 1
          fi
          if echo "$output" | grep -q -- "--- FAIL"; then
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  cross-compile:
    name: Cross-compile
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Cross-compile all targets
        run: make release

  windows-build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Build
        run: go build -o bin/waveloom.exe ./cmd/waveloom/
      - name: Test
        run: go test ./... -timeout 300s
      - name: Integration Test
        run: go test -tags=integration ./... -timeout 300s
        continue-on-error: true
      - name: Lint (go vet)
        run: go vet ./...
